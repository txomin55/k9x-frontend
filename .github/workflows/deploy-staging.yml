# Manual only, like production and the backend's: deploying staging is someone running this
# workflow, never a push. The build is always staging (CI_BUILD_ENV), whatever ref is chosen.

name: Deploy staging

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  unit_tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Cache pnpm
        uses: actions/cache@v4
        with:
          path: .pnpm-store
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install deps
        run: bash ./ci-scripts/generic-before.sh

      - name: Run unit tests
        run: bash ./ci-scripts/unit-tests.sh

      - name: Upload unit reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: reports-unit
          path: .reports/*
          include-hidden-files: true

  e2e_tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ui/app/.cache/ms-playwright
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Cache pnpm
        uses: actions/cache@v4
        with:
          path: .pnpm-store
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Resolve Playwright cache metadata
        id: playwright_meta
        run: |
          PLAYWRIGHT_VERSION="$(node -e "const fs=require('fs'); const lines=fs.readFileSync('pnpm-lock.yaml','utf8').split(/\\r?\\n/); let inApp=false; let inDev=false; let found=false; let version=''; for (const line of lines) { if (!inApp && /^  ui\\/app:$/.test(line)) { inApp=true; continue; } if (inApp && /^    devDependencies:$/.test(line)) { inDev=true; continue; } if (inApp && inDev && /^      '@playwright\\/test':$/.test(line)) { found=true; continue; } if (found) { const match=line.match(/^        version: ([^\\s]+)/); if (match) { version=match[1].split('(')[0]; break; } } if (inApp && /^  [^ ]/.test(line)) { break; } } if (!version) { process.exit(1); } process.stdout.write(version);")"
          echo "version=$PLAYWRIGHT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ui/app/.cache/ms-playwright
          key: playwright-browsers-${{ steps.playwright_meta.outputs.version }}

      - name: Install deps
        run: bash ./ci-scripts/generic-before.sh

      - name: Run E2E tests
        run: bash ./ci-scripts/e2e-tests.sh

      - name: Upload e2e reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: reports-e2e
          path: .reports
          include-hidden-files: true

  test_summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [ unit_tests, e2e_tests ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Cache pnpm
        uses: actions/cache@v4
        with:
          path: .pnpm-store
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install deps
        run: bash ./ci-scripts/generic-before.sh

      - name: Download unit reports
        uses: actions/download-artifact@v4
        with:
          name: reports-unit
          path: artifacts/unit

      - name: Download e2e reports
        uses: actions/download-artifact@v4
        with:
          name: reports-e2e
          path: artifacts/e2e

      - name: Merge reports
        run: |
          mkdir -p .reports
          cp -R artifacts/unit/. .reports/
          cp -R artifacts/e2e/. .reports/

      - name: Build summary coverage
        run: bash ./ci-scripts/test-summary.sh

      - name: Check the coverage threshold
        uses: insightsengineering/coverage-action@v3
        with:
          path: .reports/test/total/coverage/cobertura-coverage.xml
          threshold: 45
          fail: true
          publish: false
          diff: true
          diff-branch: main
          diff-storage: _xml_coverage_reports
          coverage-summary-title: "Code Coverage Summary"
          uncovered-statements-increase-failure: false
          new-uncovered-statements-failure: false
          coverage-rate-reduction-failure: true

      - name: Summarize coverage
        if: ${{ always() }}
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: .reports/test/total/coverage/cobertura-coverage.xml
          format: markdown
          output: file

      - name: Publish the coverage summary
        if: ${{ always() }}
        run: '[ -f code-coverage-results.md ] && cat code-coverage-results.md >> "$GITHUB_STEP_SUMMARY" || true'

      - name: Upload summary reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: reports-summary
          path: .reports
          include-hidden-files: true

  sonar_check:
    name: Sonar Check
    runs-on: ubuntu-latest
    needs: [ unit_tests, e2e_tests, test_summary ]
    env:
      SONAR_USER_HOME: .sonar
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download summary reports
        uses: actions/download-artifact@v4
        with:
          name: reports-summary
          path: artifacts/summary

      - name: Download unit reports
        uses: actions/download-artifact@v4
        with:
          name: reports-unit
          path: artifacts/unit

      - name: Download e2e reports
        uses: actions/download-artifact@v4
        with:
          name: reports-e2e
          path: artifacts/e2e

      - name: Merge reports
        run: |
          mkdir -p .reports
          cp -R artifacts/unit/. .reports/
          cp -R artifacts/e2e/. .reports/
          cp -R artifacts/summary/. .reports/

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  deploy:
    name: Build and deploy Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    env:
      CI_BUILD_ENV: staging
      CI_JOB_ID: ${{ github.run_id }}
      CI_COMMIT_SHORT_SHA: ${{ github.sha }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Fails in two seconds with a name, instead of shipping a bundle configured with empty strings
      # — Vite inlines a missing variable as undefined rather than failing the build.
      - name: Check the environment's secrets
        run: |
          missing=
          for v in VITE_APP_API_ADDRESS VITE_GOOGLE_CLIENT_ID VITE_GOOGLE_REDIRECT_URI VITE_VAPID_PUBLIC_KEY VITE_CARTO_API_KEY; do
            eval "value=\$$v"
            [ -n "$value" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::The github-pages environment is missing:$missing."
            exit 1
          fi
        env:
          VITE_APP_API_ADDRESS: ${{ secrets.VITE_APP_API_ADDRESS }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_REDIRECT_URI: ${{ secrets.VITE_GOOGLE_REDIRECT_URI }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VITE_CARTO_API_KEY: ${{ secrets.VITE_CARTO_API_KEY }}


      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Cache pnpm
        uses: actions/cache@v4
        with:
          path: .pnpm-store
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install deps
        run: bash ./ci-scripts/generic-before.sh

      # Vite inlines any VITE_-prefixed variable found in the build environment, which is how the
      # bundle gets its configuration now that the per-mode .env files are untracked.
      - name: Build pages
        run: bash ./ci-scripts/pages.sh
        env:
          # Structural, not configuration: it is what the site is served from, and it differs by
          # target for good. Keeping it out of the secrets also avoids an empty secret in production.
          VITE_APP_BASE_PATH: '/k9x-frontend'
          VITE_APP_API_ADDRESS: ${{ secrets.VITE_APP_API_ADDRESS }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_REDIRECT_URI: ${{ secrets.VITE_GOOGLE_REDIRECT_URI }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VITE_CARTO_API_KEY: ${{ secrets.VITE_CARTO_API_KEY }}

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
          name: github-pages
          retention-days: 7

      - id: deployment
        uses: actions/deploy-pages@v4
