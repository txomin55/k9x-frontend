# Manual only, like production and the backend's: deploying staging is someone running this
# workflow, never a push. The build is always staging (CI_BUILD_ENV), whatever ref is chosen.

name: Deploy staging

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub release after deploying pages?'
        required: false
        default: false
        type: boolean
      release_tag:
        description: 'Custom tag name for the release (only used when creating a release)'
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  pages_release:
    name: Build, Deploy Pages and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    env:
      CI_BUILD_ENV: staging
      CI_JOB_ID: ${{ github.run_id }}
      CI_COMMIT_SHORT_SHA: ${{ github.sha }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Fails in two seconds with a name, instead of shipping a bundle configured with empty strings
      # — Vite inlines a missing variable as undefined rather than failing the build.
      - name: Check the environment's secrets
        run: |
          missing=
          for v in VITE_APP_API_ADDRESS VITE_GOOGLE_CLIENT_ID VITE_GOOGLE_REDIRECT_URI VITE_VAPID_PUBLIC_KEY VITE_CARTO_API_KEY; do
            eval "value=\$$v"
            [ -n "$value" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::The github-pages environment is missing:$missing."
            exit 1
          fi
        env:
          VITE_APP_API_ADDRESS: ${{ secrets.VITE_APP_API_ADDRESS }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_REDIRECT_URI: ${{ secrets.VITE_GOOGLE_REDIRECT_URI }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VITE_CARTO_API_KEY: ${{ secrets.VITE_CARTO_API_KEY }}


      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Cache pnpm
        uses: actions/cache@v4
        with:
          path: .pnpm-store
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install deps
        run: bash ./ci-scripts/generic-before.sh

      # Vite inlines any VITE_-prefixed variable found in the build environment, which is how the
      # bundle gets its configuration now that the per-mode .env files are untracked.
      - name: Build pages
        run: bash ./ci-scripts/pages.sh
        env:
          # Structural, not configuration: it is what the site is served from, and it differs by
          # target for good. Keeping it out of the secrets also avoids an empty secret in production.
          VITE_APP_BASE_PATH: '/k9x-frontend'
          VITE_APP_API_ADDRESS: ${{ secrets.VITE_APP_API_ADDRESS }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_REDIRECT_URI: ${{ secrets.VITE_GOOGLE_REDIRECT_URI }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VITE_CARTO_API_KEY: ${{ secrets.VITE_CARTO_API_KEY }}

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
          name: github-pages
          retention-days: 7

      - name: Set release tag
        id: release_vars
        if: ${{ github.event.inputs.create_release == 'true' }}
        env:
          CUSTOM_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          if [ -n "$CUSTOM_RELEASE_TAG" ]; then
            echo "release_tag=$CUSTOM_RELEASE_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=pages-$(date -u +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"
          fi

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Create release archive
        if: ${{ github.event.inputs.create_release == 'true' }}
        run: zip -r public.zip public

      - uses: softprops/action-gh-release@v2
        if: ${{ github.event.inputs.create_release == 'true' }}
        with:
          tag_name: ${{ steps.release_vars.outputs.release_tag }}
          name: Release ${{ steps.release_vars.outputs.release_tag }}
          files: public.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
