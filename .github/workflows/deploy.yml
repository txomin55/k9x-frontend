# Manual only, like the backend's. Vercel's git integration is off (vercel.json → git.deployment
# Enabled: false), so a push deploys nothing: production goes out when someone runs this workflow.
#
# The `production` GitHub environment holds:
#   VERCEL_TOKEN       Vercel → Account Settings → Tokens
#   VERCEL_ORG_ID      `vercel link` writes both into .vercel/project.json, or read them in
#   VERCEL_PROJECT_ID  Vercel → the project → Settings → General
#   VITE_*             every variable in ui/app/.env.example, with this environment's values
#
# The build runs here, not on Vercel: `vercel build` applies vercel.json (CI_BUILD_ENV=production)
# and `--prebuilt` uploads the output, so what ships is what this run produced.

name: Deploy production

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub release after deploying?'
        required: false
        default: false
        type: boolean
      release_tag:
        description: 'Custom tag name for the release (only used when creating a release)'
        required: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check the environment's secrets
        run: |
          missing=
          [ -n "${{ secrets.VERCEL_TOKEN }}" ] || missing="$missing VERCEL_TOKEN"
          [ -n "$VERCEL_ORG_ID" ] || missing="$missing VERCEL_ORG_ID"
          [ -n "$VERCEL_PROJECT_ID" ] || missing="$missing VERCEL_PROJECT_ID"
          for v in VITE_APP_API_ADDRESS VITE_GOOGLE_CLIENT_ID VITE_GOOGLE_REDIRECT_URI VITE_VAPID_PUBLIC_KEY VITE_CARTO_API_KEY; do
            eval "value=\$$v"
            [ -n "$value" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::The production environment is missing:$missing."
            exit 1
          fi
        env:
          VITE_APP_API_ADDRESS: ${{ secrets.VITE_APP_API_ADDRESS }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_REDIRECT_URI: ${{ secrets.VITE_GOOGLE_REDIRECT_URI }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VITE_CARTO_API_KEY: ${{ secrets.VITE_CARTO_API_KEY }}


      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Cache pnpm
        uses: actions/cache@v4
        with:
          path: .pnpm-store
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install deps
        run: bash ./ci-scripts/generic-before.sh

      # Pulls the project's production settings and env vars, builds against them, then uploads the
      # finished output. Three steps rather than one so a build failure is not reported as a deploy.
      - name: Pull the Vercel environment
        run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # Vite inlines any VITE_-prefixed variable found in the build environment, which is how the
      # bundle gets its configuration now that the per-mode .env files are untracked.
      - name: Build
        run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          # Structural, not configuration: it is what the site is served from, and it differs by
          # target for good. Keeping it out of the secrets also avoids an empty secret in production.
          VITE_APP_BASE_PATH: ''
          VITE_APP_API_ADDRESS: ${{ secrets.VITE_APP_API_ADDRESS }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_REDIRECT_URI: ${{ secrets.VITE_GOOGLE_REDIRECT_URI }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VITE_CARTO_API_KEY: ${{ secrets.VITE_CARTO_API_KEY }}

      - name: Deploy
        run: npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Set release tag
        id: release_vars
        if: ${{ github.event.inputs.create_release == 'true' }}
        env:
          CUSTOM_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          if [ -n "$CUSTOM_RELEASE_TAG" ]; then
            echo "release_tag=$CUSTOM_RELEASE_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=release-$(date -u +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release archive
        if: ${{ github.event.inputs.create_release == 'true' }}
        run: (cd .vercel/output/static && zip -r "$GITHUB_WORKSPACE/public.zip" .)

      - uses: softprops/action-gh-release@v2
        if: ${{ github.event.inputs.create_release == 'true' }}
        with:
          tag_name: ${{ steps.release_vars.outputs.release_tag }}
          name: Release ${{ steps.release_vars.outputs.release_tag }}
          files: public.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
